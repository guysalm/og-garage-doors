# Static site — no build step. Netlify serves the repo root and parses
# index.html at deploy time to register the "contact" form.

[build]
  publish = "."
  command = ""

# Security and cache headers are generated into _headers by the build, so the
# CSP hashes stay in sync with the inline script and style blocks.

# tools/ is build tooling, not site content, but publish = "." ships it, so
# /tools/build-city-pages.ps1 and /tools/template.html were both answering 200.
# robots.txt asks crawlers to skip the directory; that is not the same as the
# files being unreachable, and template.html is a near-duplicate of the home
# page with unresolved {{tokens}} in it.
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------- chat (Mia)
# netlify/functions/chat.mts answers POST /api/chat (its path is set in the
# function's own config). Netlify installs package.json's dependencies at
# deploy time and bundles them into the function.
[functions]
  node_bundler = "esbuild"

# publish = "." would otherwise serve the function's source, its packages and
# the package files as plain downloads. None of it is secret (keys live in
# Netlify's environment variables), but none of it is site content either.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
